interface:
  display_name: "Opensource Finder"
  short_description: "Скилл поиска уже пройденного пути: находит решение инженерной задачи в GitHub и опенсорсе и переносит его в локальный код проверяемой правкой."
  default_prompt: "Через $opensource-finder опиши мою инженерную задачу, найди доказательства в GitHub и опенсорсе, начиная с нативных инструментов OMP и GitHub CLI, задействуй субагентов только когда это расширяет охват исследования, приведи таблицу кандидатов со звёздами и лицензией, если решением может быть готовый проект, оставь трассу субагентов при их использовании, затем предложи минимальную локальную адаптацию и способ проверки."
